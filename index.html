<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Portfólio da Giz, oficina editorial especializada em livros, revistas e projetos especiais."
  >
  <title>GIZ — Oficina Editorial | Livros, Revistas, Pré-impressão</title>

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://giz.art.br/">
  <meta property="og:title" content="GIZ — Oficina Editorial">
  <meta property="og:description" content="Portfólio da Giz, oficina editorial especializada em livros, revistas e projetos especiais.">
  <meta property="og:image" content="https://giz.art.br/assets/giz-logo.png">

  <!-- JSON-LD Organization -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "GIZ Oficina Editorial",
    "url": "https://giz.art.br",
    "logo": "https://giz.art.br/assets/giz-logo.png",
    "description": "Oficina editorial especializada em livros, revistas e projetos especiais.",
    "address": { "@type": "PostalAddress", "addressCountry": "BR" },
    "sameAs": []
  }
  </script>

  <link rel="stylesheet" href="https://use.typekit.net/ccx3zve.css">
  <link rel="stylesheet" href="portfolio.css">
</head>
<body class="portfolio-page">
  <main class="layout" aria-label="Portfólio Giz">
    <section class="left" id="left" aria-label="Grid de projetos e visualização ampliada">
      <div class="grid-view" id="grid-view">
        <div class="grid" id="grid" role="list"></div>
      </div>

      <section
        class="viewer-shell"
        id="viewer-shell"
        aria-label="Visualização do projeto"
        hidden
      ></section>
    </section>

    <aside class="panel" aria-label="Navegação e informações">
      <nav class="menu" aria-label="Navegação principal">
        <div class="menu-nav" id="menu-nav"></div>
      </nav>

      <div class="panel-logo" aria-hidden="true">
        <img src="assets/giz-logo.png" alt="" onerror="this.parentElement.style.display='none'">
      </div>

      <section class="panel-content" id="panel" aria-live="polite"></section>
    </aside>
  </main>

  <div id="dossie-view" class="dossie-view" hidden></div>

  <!-- SEO: títulos dos projetos publicados (gerado por tools/seo_build.py) -->
  <div id="seo-anchor" aria-hidden="true" style="position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden"></div>

  <script src="portfolio.config.js"></script>
  <script src="backend.config.js"></script>
  <script src="app_portfolio.js"></script>
</body>
</html>
